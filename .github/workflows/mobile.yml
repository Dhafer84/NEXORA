name: Mobile checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.3
          cache: true
      # Locked versions only: fails if pubspec.lock would change.
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      # Simulated backend only (test/support): no network, no AI provider.
      - run: flutter test
      # Proves the Android project builds; the APK is not published.
      - run: flutter build apk --debug
