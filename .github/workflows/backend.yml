name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --require-hashes -r backend/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python3 scripts/init_env.py
      - run: docker compose --env-file .env -f infrastructure/compose.yml config --quiet
      - run: docker compose --env-file .env -f infrastructure/compose.yml up --build --wait --wait-timeout 120
      - run: python3 scripts/check_api.py
      - if: always()
        run: docker compose --env-file .env -f infrastructure/compose.yml down -v
