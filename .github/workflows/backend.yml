name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Throwaway database for this job only; not a deployment secret.
      NEXORA_TEST_POSTGRES_PASSWORD: ci-ephemeral-test-database-password-0001
      NEXORA_TEST_POSTGRES_HOST: 127.0.0.1
      NEXORA_TEST_POSTGRES_PORT: '5432'
      NEXORA_REQUIRE_DB_TESTS: '1'
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: nexora
          POSTGRES_DB: nexora
          POSTGRES_PASSWORD: ci-ephemeral-test-database-password-0001
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --require-hashes -r backend/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python3 scripts/init_env.py
      - run: docker compose --env-file .env -f infrastructure/compose.yml config --quiet
      - run: docker compose --env-file .env -f infrastructure/compose.yml build
      - run: docker compose --env-file .env -f infrastructure/compose.yml run --rm backend python -m app.migrate up
      - run: docker compose --env-file .env -f infrastructure/compose.yml up --wait --wait-timeout 120
      - run: python3 scripts/check_api.py --parcours --automatisation
      - if: always()
        run: docker compose --env-file .env -f infrastructure/compose.yml down -v
