name: nexora
description: "Client Android de l’assistant personnel NEXORA."
publish_to: 'none'
version: 0.7.0+8

environment:
  sdk: ^3.11.0
  flutter: 3.41.3

# Exact versions: pubspec.lock is committed and enforced in CI.
dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_timezone: 5.1.1
  http: 1.6.0
  intl: 0.20.2
  shared_preferences: 2.5.6
  workmanager: 0.10.10

dev_dependencies:
  fake_async: 1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
