     android/app/src/main/res/drawable/ic_nexora_mark.xml. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96">
  <circle cx="12" cy="12" r="12" fill="#B8A8FF"/>
  <path d="M7.6 16.6V7.4L16.4 16.6V7.4" fill="none" stroke="#1E1442"
        stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
